name: Build macOS

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/deepThink.app"
          VERSION="${GITHUB_REF_NAME:-1.0.1}"
          # Strip leading 'v' for the script version argument
          VERSION="${VERSION#v}"
          chmod +x scripts/build_dmg.sh
          # Run the script but skip the flutter build step (already done above)
          create-dmg \
            --volname "deepThink" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "deepThink.app" 160 185 \
            --hide-extension "deepThink.app" \
            --app-drop-link 430 185 \
            "build/deepThink-v${VERSION}-macos.dmg" \
            "${APP_PATH}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepThink-macos-dmg
          path: build/deepThink-v*-macos.dmg
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/deepThink-v*-macos.dmg
          body: |
            ## deepThink ${{ github.ref_name }}

            ### macOS
            Download `deepThink-${{ github.ref_name }}-macos.dmg`, open it, and drag **deepThink.app** to your Applications folder.

            **Requirements:** macOS 13 Ventura or later · Apple Silicon (M1/M2/M3/M4) recommended · 32 GB RAM minimum for the full model stack.

            ### Windows
            A pre-compiled Windows installer is not yet available.
            Windows users can compile from source — see [windows/BUILD.md](https://github.com/007Style/deepThink/blob/main/windows/BUILD.md) for full step-by-step instructions.

            ### AI Models
            All four AI models (~22 GB total) are downloaded on first launch. The app runs **fully offline** after that.

            | Model | Tag | ~RAM |
            |-------|-----|------|
            | Mistral 7B | `mistral:7b` | ~4.1 GB |
            | Llama 3 8B | `llama3:8b` | ~4.7 GB |
            | Gemma 2 9B | `gemma2:9b` | ~5.5 GB |
            | Phi-3 14B | `phi3:14b` | ~8.2 GB |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
